{% set brand_logo = asset_url('brand/oral-logo-blue-cropped.png') %}
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Ingresar | ORAL</title>
    <link rel="icon" href="{{ asset_url('icons/favicon.ico') }}" sizes="any" />
    <link rel="icon" type="image/png" href="{{ asset_url('icons/favicon-32.png') }}" sizes="32x32" />
    <link rel="apple-touch-icon" href="{{ asset_url('icons/apple-touch-icon.png') }}" />
    <link rel="stylesheet" href="{{ asset_url('styles.css') }}" />
  </head>
  <body class="login-body">
    <main class="login">
      <img class="login__logo" src="{{ brand_logo }}" alt="ORAL odontología familiar" width="140" height="65" />
      <section class="login__card" aria-labelledby="login-title">
        <h1 id="login-title">Ingresar al panel</h1>
        <p class="login__lead">Para el equipo del consultorio.</p>
        {% if error %}
        <div class="notice notice--error" role="alert">{{ error }}</div>
        {% endif %}
        <form method="post" action="/app/login" class="stack">
          <label class="field">
            <span class="field-label">Usuario</span>
            <input type="text" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus />
          </label>
          <label class="field">
            <span class="field-label">Contraseña</span>
            <input type="password" name="password" autocomplete="current-password" required />
          </label>
          <button type="submit" class="button button--block button--lg">Ingresar</button>
        </form>
      </section>
      <p class="login__foot"><a class="text-link" href="/reservar">Ir a la reserva de turnos</a></p>
    </main>
  </body>
</html>
