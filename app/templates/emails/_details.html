<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:22px 0;border-collapse:separate;border-spacing:0 8px;">
  <tr>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:12px 0 0 12px;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#66717a;width:38%;">Día</td>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:0 12px 12px 0;font-size:15px;font-weight:800;">{{ date_long_capitalized }}</td>
  </tr>
  <tr>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:12px 0 0 12px;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#66717a;">Horario</td>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:0 12px 12px 0;font-size:15px;font-weight:800;">{{ time }} a {{ end_time }} h</td>
  </tr>
  <tr>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:12px 0 0 12px;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#66717a;">Profesional</td>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:0 12px 12px 0;font-size:15px;font-weight:800;">{{ professional_name }}{% if specialty %}<span style="font-weight:600;color:#66717a;"> · {{ specialty }}</span>{% endif %}</td>
  </tr>
  {% if clinic_address %}
  <tr>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:12px 0 0 12px;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#66717a;">Dirección</td>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:0 12px 12px 0;font-size:15px;font-weight:800;">{{ clinic_address }}</td>
  </tr>
  {% endif %}
  {% if deposit_paid %}
  <tr>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:12px 0 0 12px;font-size:11px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:#66717a;">Seña abonada</td>
    <td style="padding:12px 14px;background:#e8f3fc;border-radius:0 12px 12px 0;font-size:15px;font-weight:800;color:#006320;">{{ deposit_paid | money }}</td>
  </tr>
  {% endif %}
</table>
