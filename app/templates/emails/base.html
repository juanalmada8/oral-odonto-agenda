<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>{{ subject }}</title>
  </head>
  <body style="margin:0;padding:0;background:#f8f6f1;font-family:'Avenir Next','Helvetica Neue',Helvetica,Arial,sans-serif;color:#112433;">
    <span style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</span>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8f6f1;">
      <tr>
        <td align="center" style="padding:28px 12px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
            <tr>
              <td align="center" style="padding:0 0 18px;">
                <img src="{{ logo_url }}" width="180" alt="{{ clinic_name }}" style="display:block;border:0;width:180px;max-width:60%;height:auto;" />
              </td>
            </tr>
            <tr>
              <td style="background:#ffffff;border-radius:24px;border:1px solid #e7ebee;overflow:hidden;">
                <div style="height:6px;background:#ff5b3a;background:linear-gradient(90deg,#ff5b3a,#0f5d83);"></div>
                <div style="padding:32px 30px 28px;">
                  {% block content %}{% endblock %}
                </div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:20px 18px 0;font-size:12px;line-height:1.6;color:#66717a;">
                <strong style="color:#0f5d83;">{{ clinic_name }}</strong>
                {% if clinic_address %}<br />{{ clinic_address }}{% endif %}
                {% if clinic_phone %}<br />Tel: {{ clinic_phone }}{% endif %}
                <br />Recibís este email porque reservaste un turno en nuestro sitio.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
